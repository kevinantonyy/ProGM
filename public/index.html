<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ProGM</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --surface: #ffffff;
      --surface-2: #f8fafc;
      --text: #111827;
      --muted: #667085;
      --line: #e4e7ec;
      --brand: #111827;
      --success: #067647;
      --warning: #b54708;
      --danger: #b42318;
      --radius: 14px;
      --shadow: 0 1px 2px rgba(16, 24, 40, .04);
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
    button, select, input, textarea { font: inherit; }
    button { cursor: pointer; }
    .shell { min-height: 100vh; }
    .topbar { height: 64px; background: var(--surface); border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; padding: 0 28px; position: sticky; top: 0; z-index: 20; }
    .brand { font-size: 20px; font-weight: 800; letter-spacing: -.02em; }
    .top-actions { display: flex; gap: 8px; align-items: center; }
    .btn { border: 1px solid var(--line); background: var(--surface); color: var(--text); padding: 9px 13px; border-radius: 9px; font-weight: 650; }
    .btn.primary { background: var(--brand); color: white; border-color: var(--brand); }
    .btn.ghost { background: transparent; }
    .sportbar { background: var(--surface); border-bottom: 1px solid var(--line); padding: 0 28px; display: flex; gap: 28px; }
    .sport-tab { padding: 16px 1px 14px; border: 0; border-bottom: 2px solid transparent; background: transparent; color: var(--muted); font-weight: 700; }
    .sport-tab.active { color: var(--text); border-bottom-color: var(--text); }
    .page { max-width: 1240px; margin: 0 auto; padding: 26px 24px 60px; }
    .team-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; margin-bottom: 18px; }
    .team-title h1 { margin: 0; font-size: 26px; letter-spacing: -.03em; }
    .team-title p { margin: 6px 0 0; color: var(--muted); }
    .team-select-wrap { min-width: 260px; }
    select { width: 100%; background: var(--surface); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
    .league-strip { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 22px; }
    .chip { border: 1px solid var(--line); background: var(--surface); color: #344054; padding: 6px 9px; border-radius: 999px; font-size: 12px; font-weight: 650; }
    .subnav { display: flex; gap: 4px; background: #e9edf2; padding: 4px; border-radius: 11px; width: fit-content; margin-bottom: 20px; }
    .view-tab { border: 0; background: transparent; color: #475467; border-radius: 8px; padding: 8px 12px; font-weight: 700; }
    .view-tab.active { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
    .grid { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 18px; }
    .stack { display: grid; gap: 14px; }
    .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
    .panel-head { padding: 17px 18px 13px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .panel-head h2 { margin: 0; font-size: 16px; letter-spacing: -.01em; }
    .panel-head .sub { color: var(--muted); font-size: 12px; }
    .panel-body { padding: 0 18px 18px; }
    .empty { padding: 38px 18px; text-align: center; color: var(--muted); }
    .empty strong { display: block; color: var(--text); margin-bottom: 6px; }
    .player-list { border-top: 1px solid var(--line); }
    .player-row { display: grid; grid-template-columns: 42px minmax(0, 1fr) auto auto; gap: 12px; align-items: center; padding: 12px 18px; border-bottom: 1px solid var(--line); }
    .player-row:last-child { border-bottom: 0; }
    .slot { width: 38px; color: var(--muted); font-size: 12px; font-weight: 800; }
    .player-name { font-weight: 750; }
    .player-meta { color: var(--muted); font-size: 12px; margin-top: 3px; }
    .metric { text-align: right; min-width: 72px; }
    .metric strong { display: block; font-size: 14px; }
    .metric span { color: var(--muted); font-size: 11px; }
    .status-pill { font-size: 11px; font-weight: 750; border-radius: 999px; padding: 4px 7px; background: #fff4ed; color: var(--warning); }
    .rec-card { border: 1px solid var(--line); border-radius: 12px; padding: 15px; margin-bottom: 10px; }
    .rec-card:last-child { margin-bottom: 0; }
    .rec-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .rec-title { font-weight: 800; }
    .rec-reason { color: #475467; font-size: 13px; margin-top: 6px; line-height: 1.45; }
    .gain { color: var(--success); font-weight: 800; white-space: nowrap; }
    .evidence { margin-top: 12px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .evidence-item { background: var(--surface-2); border-radius: 8px; padding: 9px; }
    .evidence-item span { display: block; color: var(--muted); font-size: 11px; }
    .evidence-item strong { display: block; margin-top: 2px; font-size: 12px; }
    .source-line { margin-top: 10px; color: var(--muted); font-size: 11px; }
    .rank { width: 26px; height: 26px; border: 1px solid var(--line); border-radius: 8px; display: grid; place-items: center; font-weight: 800; font-size: 12px; }
    .draft-row { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 10px; padding: 13px 0; border-bottom: 1px solid var(--line); align-items: center; }
    .draft-row:last-child { border-bottom: 0; }
    .draft-tags { margin-top: 5px; display: flex; gap: 6px; flex-wrap: wrap; }
    .mini { color: var(--muted); font-size: 11px; }
    .trade-card { border: 1px solid var(--line); border-radius: 12px; padding: 15px; margin-bottom: 10px; }
    .trade-flow { display: grid; grid-template-columns: 1fr 36px 1fr; align-items: center; gap: 8px; margin: 12px 0; }
    .trade-player { background: var(--surface-2); border-radius: 9px; padding: 10px; }
    .trade-player small { color: var(--muted); }
    .arrow { text-align: center; color: var(--muted); }
    .source-card { padding: 12px 0; border-bottom: 1px solid var(--line); }
    .source-card:last-child { border-bottom: 0; }
    .source-card strong { font-size: 13px; }
    .source-card p { color: var(--muted); font-size: 12px; margin: 4px 0 0; line-height: 1.4; }
    .settings-list { display: grid; gap: 8px; }
    .setting { display: flex; justify-content: space-between; gap: 16px; font-size: 12px; }
    .setting span:first-child { color: var(--muted); }
    .loader { color: var(--muted); padding: 28px 0; text-align: center; }
    .notice { padding: 12px 14px; border: 1px solid #fedf89; background: #fffaeb; color: #93370d; border-radius: 10px; font-size: 13px; margin-bottom: 14px; }
    .hidden { display: none !important; }
    @media (max-width: 900px) {
      .grid { grid-template-columns: 1fr; }
      .team-header { flex-direction: column; }
      .team-select-wrap { width: 100%; min-width: 0; }
      .topbar, .sportbar { padding-left: 16px; padding-right: 16px; }
      .page { padding: 20px 14px 50px; }
    }
    @media (max-width: 600px) {
      .player-row { grid-template-columns: 36px minmax(0, 1fr) auto; }
      .player-row .metric.secondary { display: none; }
      .evidence { grid-template-columns: 1fr; }
      .top-actions .btn.ghost { display: none; }
      .sportbar { gap: 18px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">ProGM</div>
      <div class="top-actions">
        <button id="connectBtn" class="btn primary" onclick="location.href='/auth/yahoo'">Connect Yahoo</button>
        <button id="logoutBtn" class="btn ghost hidden" onclick="location.href='/logout'">Log out</button>
      </div>
    </header>

    <nav class="sportbar" aria-label="Sports">
      <button class="sport-tab active" data-sport="nfl">Football</button>
      <button class="sport-tab" data-sport="nba">Basketball</button>
    </nav>

    <main class="page">
      <div class="team-header">
        <div class="team-title">
          <h1 id="sportTitle">Fantasy Football</h1>
          <p id="teamSubtitle">Connect Yahoo to load your league.</p>
        </div>
        <div class="team-select-wrap">
          <select id="teamSelect" disabled><option>No teams loaded</option></select>
        </div>
      </div>

      <div id="leagueStrip" class="league-strip"></div>

      <nav class="subnav" aria-label="Team tools">
        <button class="view-tab active" data-view="overview">Overview</button>
        <button class="view-tab" data-view="lineup">Start / Bench</button>
        <button class="view-tab" data-view="trades">Trades</button>
        <button class="view-tab" data-view="draft">Draft</button>
      </nav>

      <div id="notice" class="notice hidden"></div>
      <section id="content"><div class="panel"><div class="empty"><strong>Connect your Yahoo account</strong>ProGM will read your league settings and build recommendations from your actual roster.</div></div></section>
    </main>
  </div>

  <script>
    const state = {
      connected: false,
      sport: 'nfl',
      view: 'overview',
      teams: [],
      selectedTeam: null,
      analysis: null,
      tradeSuggestions: null,
      tradeLoading: false
    };

    const $ = (id) => document.getElementById(id);
    const esc = (v) => String(v ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));

    function setNotice(text) {
      const el = $('notice');
      if (!text) { el.classList.add('hidden'); el.textContent = ''; return; }
      el.textContent = text; el.classList.remove('hidden');
    }

    function sportName() { return state.sport === 'nfl' ? 'Fantasy Football' : 'Fantasy Basketball'; }

    function setSport(sport) {
      state.sport = sport;
      state.analysis = null;
      state.tradeSuggestions = null;
      document.querySelectorAll('.sport-tab').forEach(b => b.classList.toggle('active', b.dataset.sport === sport));
      $('sportTitle').textContent = sportName();
      populateTeamSelect();
      const available = state.teams.filter(t => t.sport === sport);
      state.selectedTeam = available[0] || null;
      if (state.selectedTeam) loadTeam(state.selectedTeam); else renderNoTeam();
    }

    function setView(view) {
      state.view = view;
      document.querySelectorAll('.view-tab').forEach(b => b.classList.toggle('active', b.dataset.view === view));
      if (view === 'trades' && state.selectedTeam && !state.tradeSuggestions && !state.tradeLoading) loadTrades();
      render();
    }

    function populateTeamSelect() {
      const teams = state.teams.filter(t => t.sport === state.sport);
      const select = $('teamSelect');
      select.disabled = teams.length === 0;
      if (!teams.length) { select.innerHTML = '<option>No teams found</option>'; return; }
      select.innerHTML = teams.map((t, i) => `<option value="${i}">${esc(t.name)}</option>`).join('');
      const idx = Math.max(0, teams.findIndex(t => state.selectedTeam && t.team_key === state.selectedTeam.team_key));
      select.value = String(idx);
    }

    function leagueChips() {
      if (!state.analysis) return '';
      const s = state.analysis.leagueSettings || {};
      const chips = [];
      if (state.sport === 'nfl') chips.push(s.scoringFormat === 'ppr' ? 'PPR' : s.scoringFormat === 'half' ? 'Half PPR' : s.scoringFormat === 'superflex' ? 'Superflex' : 'Standard');
      if (s.teamCount) chips.push(`${s.teamCount} teams`);
      if (s.scoringType) chips.push(s.scoringType);
      (s.rosterPositions || []).slice(0, 10).forEach(r => chips.push(`${r.count} ${r.position}`));
      return chips.map(c => `<span class="chip">${esc(c)}</span>`).join('');
    }

    function renderNoTeam() {
      $('teamSubtitle').textContent = state.connected ? `No ${state.sport === 'nfl' ? 'football' : 'basketball'} team found on this Yahoo account.` : 'Connect Yahoo to load your league.';
      $('leagueStrip').innerHTML = '';
      $('content').innerHTML = `<div class="panel"><div class="empty"><strong>${state.connected ? `No ${esc(sportName())} team yet` : 'Connect your Yahoo account'}</strong>${state.connected ? 'Create or join a Yahoo league, then refresh this page.' : 'ProGM will read your league settings and build recommendations from your actual roster.'}</div></div>`;
    }

    function sourcePanel() {
      const sources = state.analysis?.sources || [];
      return `<div class="panel"><div class="panel-head"><h2>Recommendation sources</h2></div><div class="panel-body">${sources.map(s => `<div class="source-card"><strong>${esc(s.name)}</strong><p>${esc(s.role)}</p></div>`).join('') || '<div class="mini">No sources loaded.</div>'}</div></div>`;
    }

    function settingsPanel() {
      const s = state.analysis?.leagueSettings || {};
      const format = state.sport === 'nfl' ? (s.scoringFormat || 'std').toUpperCase() : (s.scoringType || 'Yahoo league');
      return `<div class="panel"><div class="panel-head"><h2>League settings</h2></div><div class="panel-body settings-list">
        <div class="setting"><span>Scoring</span><strong>${esc(format)}</strong></div>
        <div class="setting"><span>Teams</span><strong>${esc(s.teamCount || '—')}</strong></div>
        <div class="setting"><span>Roster slots</span><strong>${esc((s.rosterPositions || []).reduce((n,r)=>n+Number(r.count||0),0) || '—')}</strong></div>
        ${state.sport === 'nfl' ? `<div class="setting"><span>Reception pts</span><strong>${esc(s.receptionPoints ?? '—')}</strong></div>` : ''}
      </div></div>`;
    }

    function playerRows(players) {
      if (!players?.length) return '<div class="empty">No players found.</div>';
      const ordered = [...players].sort((a,b) => {
        const ai = ['BN','IR','IL','IL+'].includes(a.selected_position) ? 1 : 0;
        const bi = ['BN','IR','IL','IL+'].includes(b.selected_position) ? 1 : 0;
        return ai - bi || b.score - a.score;
      });
      return `<div class="player-list">${ordered.map(p => `<div class="player-row">
        <div class="slot">${esc(p.selected_position || p.display_position || '—')}</div>
        <div><div class="player-name">${esc(p.name)}</div><div class="player-meta">${esc(p.editorial_team_abbr || '')}${p.opponent ? ` · ${esc(p.opponent)}` : ''}${p.byeWeek ? ` · Bye ${esc(p.byeWeek)}` : ''}</div></div>
        <div class="metric"><strong>${p.projectionPoints ? esc(p.projectionPoints) : '—'}</strong><span>${state.sport === 'nfl' ? 'proj pts' : 'projection'}</span></div>
        <div class="metric secondary"><strong>${p.weeklyRank && p.weeklyRank < 9999 ? '#' + esc(p.weeklyRank) : p.playerRaterRank && p.playerRaterRank < 9999 ? '#' + esc(p.playerRaterRank) : '—'}</strong><span>expert rank</span></div>
        ${p.status || p.injuryStatus ? `<span class="status-pill">${esc(p.status || p.injuryStatus)}</span>` : ''}
      </div>`).join('')}</div>`;
    }

    function overviewView() {
      return `<div class="grid"><div class="stack">
        <div class="panel"><div class="panel-head"><div><h2>My roster</h2><div class="sub">Yahoo lineup with current external projections</div></div></div>${playerRows(state.analysis.roster || [])}</div>
      </div><aside class="stack">${settingsPanel()}${sourcePanel()}</aside></div>`;
    }

    function lineupView() {
      const ideas = state.analysis.lineupSuggestions || [];
      const cards = ideas.map(i => `<div class="rec-card"><div class="rec-top"><div><div class="rec-title">${esc(i.text)}</div><div class="rec-reason">${esc(i.reason || '')}</div></div>${i.gain > 0 ? `<div class="gain">+${esc(i.gain)}</div>` : ''}</div>
        ${(i.evidence || []).length ? `<div class="evidence">${i.evidence.map(e => `<div class="evidence-item"><span>${esc(e.label)}</span><strong>${esc(e.value)}</strong></div>`).join('')}</div>` : ''}
        <div class="source-line">Sources: ${esc((i.sources || []).join(' · '))}</div></div>`).join('');
      return `<div class="grid"><div class="stack"><div class="panel"><div class="panel-head"><div><h2>Start / Bench recommendations</h2><div class="sub">Changes only appear when the model clears a meaningful edge.</div></div></div><div class="panel-body">${cards || '<div class="empty">No recommendations yet.</div>'}</div></div>
        <div class="panel"><div class="panel-head"><h2>Current lineup</h2></div>${playerRows(state.analysis.roster || [])}</div>
      </div><aside class="stack">${settingsPanel()}${sourcePanel()}</aside></div>`;
    }

    function tradesView() {
      if (state.tradeLoading) return `<div class="panel"><div class="loader">Scanning league rosters for plausible trade targets…</div></div>`;
      const data = state.tradeSuggestions;
      if (!data) return `<div class="panel"><div class="loader">Preparing trade analysis…</div></div>`;
      const cards = (data.suggestions || []).map(t => `<div class="trade-card"><div class="rec-top"><div><div class="rec-title">Trade with ${esc(t.opponentTeam?.name || 'league opponent')}</div><div class="rec-reason">${esc(t.reason)}</div></div>${t.projectedDelta > 0 ? `<div class="gain">+${esc(t.projectedDelta)}</div>` : ''}</div>
        <div class="trade-flow"><div class="trade-player"><small>Send</small><div class="player-name">${esc(t.give?.name)}</div><div class="player-meta">${esc(t.give?.position)} · ${esc(t.give?.team)}</div></div><div class="arrow">→</div><div class="trade-player"><small>Target</small><div class="player-name">${esc(t.get?.name)}</div><div class="player-meta">${esc(t.get?.position)} · ${esc(t.get?.team)}</div></div></div>
        <div class="source-line">Value gap: ${esc(t.fairnessGap)} · Sources: ${esc((t.sources || []).join(' · '))}</div></div>`).join('');
      return `<div class="grid"><div class="stack"><div class="panel"><div class="panel-head"><div><h2>Trade opportunities</h2><div class="sub">Scanned ${esc(data.teamsScanned || 0)} other Yahoo rosters for comparable-value fits.</div></div></div><div class="panel-body">${cards || '<div class="empty"><strong>No clear trade targets yet</strong>Once more teams have complete rosters, ProGM will have more viable matches.</div>'}</div></div></div><aside class="stack">${settingsPanel()}${sourcePanel()}</aside></div>`;
    }

    function draftView() {
      const list = state.analysis.draftSuggestions || [];
      const rows = list.map((p,i) => `<div class="draft-row"><div class="rank">${i+1}</div><div><div class="player-name">${esc(p.name)} <span class="mini">${esc(p.position)} · ${esc(p.team)}</span></div><div class="player-meta">${esc(p.reason)}</div><div class="draft-tags">${p.expertRank ? `<span class="chip">Expert #${esc(p.expertRank)}</span>` : ''}${p.adp ? `<span class="chip">ADP ${esc(p.adp)}</span>` : ''}${p.byeWeek ? `<span class="chip">Bye ${esc(p.byeWeek)}</span>` : ''}${p.rosterNeed >= 18 ? `<span class="chip">Roster need</span>` : ''}</div></div><div class="metric"><strong>${esc(p.draftValue)}</strong><span>value score</span></div></div>`).join('');
      return `<div class="grid"><div class="stack"><div class="panel"><div class="panel-head"><div><h2>Draft board</h2><div class="sub">Best available players adjusted for your Yahoo league settings and current roster.</div></div></div><div class="panel-body">${rows || '<div class="empty"><strong>No draft suggestions available</strong>This view populates from players currently available in your Yahoo league.</div>'}</div></div></div><aside class="stack">${settingsPanel()}${sourcePanel()}</aside></div>`;
    }

    function render() {
      if (!state.selectedTeam || !state.analysis) return;
      $('teamSubtitle').textContent = state.selectedTeam.name;
      $('leagueStrip').innerHTML = leagueChips();
      if (state.view === 'lineup') $('content').innerHTML = lineupView();
      else if (state.view === 'trades') $('content').innerHTML = tradesView();
      else if (state.view === 'draft') $('content').innerHTML = draftView();
      else $('content').innerHTML = overviewView();
    }

    async function loadTeam(team) {
      state.selectedTeam = team;
      state.analysis = null;
      state.tradeSuggestions = null;
      setNotice('');
      $('teamSubtitle').textContent = team.name;
      $('leagueStrip').innerHTML = '';
      $('content').innerHTML = '<div class="panel"><div class="loader">Loading league settings, roster and professional data…</div></div>';
      try {
        const res = await fetch(`/api/team-analysis?team_key=${encodeURIComponent(team.team_key)}&league_key=${encodeURIComponent(team.league_key)}&sport=${encodeURIComponent(team.sport)}`);
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Failed to analyze team');
        state.analysis = data;
        render();
        if (state.view === 'trades') loadTrades();
      } catch (err) {
        $('content').innerHTML = `<div class="panel"><div class="empty"><strong>Could not load this team</strong>${esc(err.message)}</div></div>`;
      }
    }

    async function loadTrades() {
      if (!state.selectedTeam || state.tradeLoading) return;
      state.tradeLoading = true; render();
      try {
        const t = state.selectedTeam;
        const res = await fetch(`/api/trade-suggestions?team_key=${encodeURIComponent(t.team_key)}&league_key=${encodeURIComponent(t.league_key)}&sport=${encodeURIComponent(t.sport)}`);
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Trade analysis failed');
        state.tradeSuggestions = data;
      } catch (err) {
        state.tradeSuggestions = { suggestions: [], teamsScanned: 0 };
        setNotice(`Trade scan: ${err.message}`);
      } finally { state.tradeLoading = false; render(); }
    }

    async function init() {
      document.querySelectorAll('.sport-tab').forEach(b => b.addEventListener('click', () => setSport(b.dataset.sport)));
      document.querySelectorAll('.view-tab').forEach(b => b.addEventListener('click', () => setView(b.dataset.view)));
      $('teamSelect').addEventListener('change', () => {
        const teams = state.teams.filter(t => t.sport === state.sport);
        const team = teams[Number($('teamSelect').value)];
        if (team) loadTeam(team);
      });

      try {
        const me = await fetch('/api/me').then(r => r.json());
        state.connected = !!me.connected;
        $('connectBtn').classList.toggle('hidden', state.connected);
        $('logoutBtn').classList.toggle('hidden', !state.connected);
        if (!state.connected) { renderNoTeam(); return; }

        const res = await fetch('/api/yahoo/teams');
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Could not load Yahoo teams');
        state.teams = data.teams || [];
        if (data.warnings?.length) setNotice(`Yahoo: ${data.warnings.join(' · ')}`);
        populateTeamSelect();
        const teams = state.teams.filter(t => t.sport === state.sport);
        state.selectedTeam = teams[0] || null;
        if (state.selectedTeam) loadTeam(state.selectedTeam); else renderNoTeam();
      } catch (err) {
        setNotice(err.message);
        renderNoTeam();
      }
    }

    init();
  </script>
</body>
</html>
