name: CI

# Runs on pull requests into main and on pushes to the release branch.
# No secrets are used or needed: tests run against mocks and synthetic data, never real Yahoo, Gemini, ESPN or database services.
on:
  pull_request:
    branches: [main]
  push:
    branches: [release/progm-hardening]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22] # package.json engines: node >=20
    steps:
      - name: Check out (full history, to diff against main)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      # Not the root `npm ci`: the root postinstall installs both packages again and runs the production build.
      - name: Install server dependencies
        run: npm ci --prefix server
      - name: Install client dependencies
        run: npm ci --prefix client

      - name: Whitespace check (git diff --check against main)
        run: git diff --check origin/main...HEAD

      # NODE_OPTIONS preloads a guard that throws on any non-loopback fetch/socket, so a test that reaches a real service fails.
      - name: Server tests
        run: npm test --prefix server
        env:
          CI: 'true'
          NODE_OPTIONS: --import=${{ github.workspace }}/.github/ci/deny-external-network.mjs

      - name: Client tests
        run: node --test
        working-directory: client
        env:
          CI: 'true'
          NODE_OPTIONS: --import=${{ github.workspace }}/.github/ci/deny-external-network.mjs

      # No VITE_PROGM_* variable is set, so the football trade negotiator stays paused in this build.
      - name: Production client build
        run: npm run build --prefix client
