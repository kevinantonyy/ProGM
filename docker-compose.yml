services:
  mysql:
    image: mysql:8.0
    container_name: fantasyprogm-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: fantasy123
      MYSQL_DATABASE: fantasyprogm
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
