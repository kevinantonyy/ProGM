services:
  - type: web
    name: ProGM
    runtime: node
    plan: free
    region: ohio
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: YAHOO_CLIENT_ID
        sync: false
      - key: YAHOO_CLIENT_SECRET
        sync: false
      - key: YAHOO_REDIRECT_URI
        value: https://progm.onrender.com/api/yahoo/callback
      - key: GEMINI_API_KEY
        sync: false
      # External NBA data provider (Tank01 via RapidAPI). Enter in dashboard.
      - key: RAPIDAPI_KEY
        sync: false
      - key: NBA_STATS_FALLBACK
        value: "false"
      # TEMPORARY: enables GET /api/diagnostics/free-nba (authenticated-only
      # Render->ESPN/NBA CDN connectivity probe). Set to "false" to disable
      # without a code change once the connectivity test is complete.
      - key: ENABLE_FREE_NBA_DIAG
        value: "true"
