services:
  - type: web
    name: ProGM
    runtime: node
    plan: free
    region: ohio
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: YAHOO_CLIENT_ID
        sync: false
      - key: YAHOO_CLIENT_SECRET
        sync: false
      - key: YAHOO_REDIRECT_URI
        value: https://progm.onrender.com/api/yahoo/callback
      - key: GEMINI_API_KEY
        sync: false
